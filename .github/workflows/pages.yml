name: pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build web and docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Audit dependencies
        working-directory: web
        run: npm audit --audit-level=moderate
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Run tests
        working-directory: web
        run: npm test
      - name: Build landing page and VitePress docs
        working-directory: web
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}/docs/
          VITE_DOCS_URL: ${{ steps.pages.outputs.base_path }}/docs/
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    name: deploy to github pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
