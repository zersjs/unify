[workspace]
resolver = "2"
members = [
    "crates/unify-proto",
    "crates/unify-core",
    "crates/unify-security",
    "crates/unify-net",
    "crates/unify-platform",
    "crates/unify-runtime",
    "crates/unify-cli",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["Unify"]

[workspace.dependencies]
unify-proto = { path = "crates/unify-proto" }
unify-core = { path = "crates/unify-core" }
unify-security = { path = "crates/unify-security" }
unify-net = { path = "crates/unify-net" }
unify-platform = { path = "crates/unify-platform" }
unify-runtime = { path = "crates/unify-runtime" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
postcard = { version = "1.1.3", features = ["use-std"] }
thiserror = "2.0.17"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2.3"
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
rcgen = { version = "0.14.5", default-features = false, features = ["ring", "pem"] }
spake2 = "0.4.0"
sha2 = "0.11.1"
hmac = "0.12.1"
hex = "0.4.3"
rand = "0.8.5"
zeroize = { version = "1.8.1", features = ["derive"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native"] }
mdns-sd = "0.13.11"
base64 = "0.22.1"
directories = "6.0.0"
clap = { version = "4.5.48", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
